# Weekly pull requests for outdated or vulnerable dependencies (M19 task 18). Security fixes are
# opened as soon as an advisory is published, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades introduce breaking API / architecture changes and must be done intentionally.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      arrow-and-parquet:
        patterns:
          - "arrow*"
          - "parquet*"
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades introduce breaking API / architecture changes and must be done intentionally.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # dtolnay/rust-toolchain channel is strictly pinned in rust-toolchain.toml and docker/engine.Dockerfile.
      - dependency-name: dtolnay/rust-toolchain
