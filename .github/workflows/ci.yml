name: ci
# Pull requests, and pushes to main (pushing a branch with an open PR would otherwise run
# everything twice). A newer push cancels the run it replaces.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spectra
          POSTGRES_PASSWORD: spectra
          POSTGRES_DB: spectra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spectra -d spectra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://spectra:spectra@localhost:5432/spectra
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (debug, overflow checks on)
        run: cargo test --workspace
      - name: Test (release)
        run: cargo test --workspace --release
      - name: Parity scripts are reproducible
        run: |
          python3 parity/gen_ops.py parity/ops
          python3 parity/gen_data.py parity/data
          git diff --exit-code parity/ops parity/data
      - name: S3 artifact storage (feature build and tests)
        run: |
          cargo clippy -p spectra-db -p spectra-api --features spectra-api/s3 --all-targets -- -D warnings
          cargo test -p spectra-db --features s3 --lib
      - name: Backup, restore and registry anchor scripts
        run: |
          cargo run --quiet -p spectra-db -- migrate
          ADMIN_EMAIL=ci@example.com cargo run --quiet -p spectra-db -- seed
          scripts/backup-postgres.sh "$RUNNER_TEMP/backups"
          psql "$DATABASE_URL" -c 'CREATE DATABASE spectra_restore'
          RESTORE_DATABASE_URL=postgresql://spectra:spectra@localhost:5432/spectra_restore \
            scripts/restore-postgres.sh "$(ls "$RUNNER_TEMP"/backups/spectra-*.dump | tail -1)"
          scripts/anchor-registry-hash.sh "$RUNNER_TEMP/anchors"
      - name: Generated API types are current
        run: |
          scripts/generate-typescript-client.sh
          if git ls-files --error-unmatch web/frontend/lib/generated/engine-api.ts >/dev/null 2>&1; then
            git diff --exit-code web/frontend/lib/generated \
              || { echo "::error::Run 'just api-client' and commit web/frontend/lib/generated"; exit 1; }
          else
            echo "::warning::web/frontend/lib/generated is not committed yet: run 'just api-client' and commit it"
          fi

  portable:
    # Behavioural tests on other platforms (bit-exact parity tests need glibc and are compiled out).
    # macOS and Windows runners are scarce and cost several times the minutes of Linux ones, so this
    # runs after merging to main (and on demand), not on every pull request.
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (release)
        run: cargo test --workspace --release

  web:
    # Next.js app: typecheck, then the auth and security tests (incl. the permission rules for
    # every API route) against a real Postgres.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web/frontend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
