name: ci
# Pull requests, and pushes to main (pushing a branch with an open PR would otherwise run
# everything twice). A newer push cancels the run it replaces.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spectra
          POSTGRES_PASSWORD: spectra
          POSTGRES_DB: spectra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spectra -d spectra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://spectra:spectra@localhost:5432/spectra
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (debug, overflow checks on)
        run: cargo test --workspace
      - name: Test (release)
        run: cargo test --workspace --release
      - name: Parity scripts are reproducible
        run: |
          python3 parity/gen_ops.py parity/ops
          python3 parity/gen_data.py parity/data
          git diff --exit-code parity/ops parity/data

  portable:
    # Behavioural tests on other platforms (bit-exact parity tests need glibc and are compiled out).
    # macOS and Windows runners are scarce and cost several times the minutes of Linux ones, so this
    # runs after merging to main (and on demand), not on every pull request.
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (release)
        run: cargo test --workspace --release

  web:
    # Next.js app: typecheck, then the auth and security tests (incl. the permission rules for
    # every API route) against a real Postgres.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web/frontend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
