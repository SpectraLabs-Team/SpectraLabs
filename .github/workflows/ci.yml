name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (debug, overflow checks on)
        run: cargo test --workspace
      - name: Test (release)
        run: cargo test --workspace --release
      - name: Parity scripts are reproducible
        run: |
          python3 parity/gen_ops.py parity/ops
          python3 parity/gen_data.py parity/data
          git diff --exit-code parity/ops parity/data

  portable:
    # Behavioural tests on other platforms (bit-exact parity tests need glibc and are compiled out).
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (release)
        run: cargo test --workspace --release
