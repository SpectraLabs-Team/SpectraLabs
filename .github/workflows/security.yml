name: security

# M19 task 18: dependency and secret scanning. Runs on pull requests, pushes to main, and weekly,
# because new advisories land against code that hasn't changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1' # Mondays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: a secret removed in a later commit is still leaked
      - name: Install gitleaks (checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          if ! gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks --pattern "$tarball" --pattern "$checksums" 2>/dev/null; then
            base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
            curl -sSfLO --retry 5 --retry-connrefused "$base/$tarball"
            curl -sSfLO --retry 5 --retry-connrefused "$base/$checksums"
          fi
          grep " $tarball\$" "$checksums" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan every commit
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner

  npm-audit:
    name: npm audit (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Reads package-lock.json only; nothing is installed or run.
      - name: Production dependencies (fail on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: All dependencies, including dev tools (fail on critical)
        run: npm audit --audit-level=critical

  cargo-audit:
    name: cargo audit (engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # SQLx's macros lock optional MySQL support (and its rsa dependency) even though this
      # workspace enables only PostgreSQL. `cargo tree -i rsa` confirms rsa is not compiled.
      # RustSec has no fixed rsa release; keep auditing everything else and re-evaluate this
      # exception when SQLx drops that optional lockfile dependency or rsa is fixed.
      # Parquet depends on paste (RUSTSEC-2024-0436 unmaintained).
      # RUSTSEC-2026-0435: thrift 0.17.0
      # Pulled in transitively by parquet 54.3.1 (thrift = "^0.17").
      # Upstream patched version is >=0.23.0, which is a semver-breaking upgrade
      # not supported by parquet 54.3.1. Requires upgrading parquet across major versions.
      # Date: 2026-11-02
      # remove by 2026-12-02
      # RUSTSEC-2026-0459: libsqlite3-sys via C SQLite CVE-2026-119375 (Date: 2026-10-30)
      # RUSTSEC-2026-0486: rustix xattr functions (Date: 2026-10-27)
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0435 --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2026-0486
