[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/SpectraLabs-Team/spectralabs"
rust-version = "1.89"

# Third-party crates are allowed only in the service crates (spectra-api, and later the worker and
# storage crates). spectra-core, -engine, -risk, -research and the other library crates stay
# standard-library only, so parity results cannot drift with a dependency upgrade.
[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["set-header"] }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "json"] }
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Fixed-point code converts between i64/i128/f64 deliberately and checks ranges itself.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Numeric constants are copied digit-for-digit from glibc/fdlibm for bit-exact parity.
excessive_precision = "allow"
# Parity code reproduces the C++ engine's exact float comparisons and NaN handling.
float_cmp = "allow"
neg_cmp_op_on_partial_ord = "allow"
# Style lints that fight a faithful port of numeric code.
format_push_string = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
items_after_statements = "allow"
struct_field_names = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
# `a + (b + 1) / 2` reproduces the C++ rank formula exactly; it is not a midpoint.
manual_midpoint = "allow"
assert_is_empty = "allow"

[profile.release]
debug = 1
