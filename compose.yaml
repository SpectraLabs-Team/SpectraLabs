# Local Postgres for development: `docker compose up -d db` from the repository root.
# Then in web/frontend/.env.local:
#   DATABASE_URL=postgresql://spectra:spectra@localhost:5432/spectralabs
# Data lives in the `pgdata` volume; `docker compose down -v` wipes it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spectra
      POSTGRES_PASSWORD: spectra # local only; never reuse for a shared or hosted database
      POSTGRES_DB: spectralabs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectra -d spectralabs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
