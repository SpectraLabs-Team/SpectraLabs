[package]
name = "spectra-db"
description = "Spectra Labs Postgres access: connection pool, migrations, dev seed and typed queries"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
spectra-core = { path = "../spectra-core" }
spectra-data = { path = "../spectra-data" }
serde.workspace = true
serde_json.workspace = true
# S3-compatible artifact storage, only with `--features s3`.
object_store = { version = "0.14", default-features = false, features = ["aws"], optional = true }

[features]
s3 = ["dep:object_store"]

[lints]
workspace = true
