[package]
name = "spectra-registry"
description = "Spectra Labs experiment registry (hash-chained run log) and holdout vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
spectra-core = { path = "../spectra-core" }
spectra-data = { path = "../spectra-data" }
spectra-engine = { path = "../spectra-engine" }
spectra-research = { path = "../spectra-research" }
spectra-db = { path = "../spectra-db", optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[features]
# The file registry and its parity surface remain std-only by default.
postgres = ["dep:spectra-db", "dep:sqlx", "dep:tokio", "dep:uuid"]

[lints]
workspace = true
