# S3-compatible artifact storage for the worker, and for the API, which reads backtest
# chart series from the same bucket (M20 step 13, M3).
#
# Local RustFS (bucket created for you):
#   docker compose -f docker-compose.yml -f deploy/compose.s3.yml --profile s3 up -d --build
#
# AWS S3, Cloudflare R2 or another provider: create the bucket, then set in .env
#   ARTIFACT_S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION and
#   AWS_ENDPOINT (e.g. https://s3.eu-west-1.amazonaws.com), AWS_ALLOW_HTTP=false
# and run without the local S3 profile:
#   docker compose -f docker-compose.yml -f deploy/compose.s3.yml up -d --build
#
# Existing artifacts on the local volume are not copied. The key layout is the
# same (<prefix>/sha256/ab/cd/<hash>), so copy them once before switching, e.g.
#   aws s3 sync <artifacts volume>/sha256 s3://$ARTIFACT_S3_BUCKET/$ARTIFACT_S3_PREFIX/sha256
services:
  api:
    build:
      args:
        CARGO_FEATURES: spectra-api/s3
    image: spectralabs/engine:dev-s3
    environment:
      ARTIFACT_STORAGE: s3
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-spectra-artifacts}
      ARTIFACT_S3_PREFIX: ${ARTIFACT_S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-spectra-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me-local-s3-secret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://rustfs:9000}
      AWS_ALLOW_HTTP: ${AWS_ALLOW_HTTP:-true}

  worker:
    build:
      args:
        CARGO_FEATURES: spectra-api/s3
    image: spectralabs/engine:dev-s3
    environment:
      ARTIFACT_STORAGE: s3
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-spectra-artifacts}
      ARTIFACT_S3_PREFIX: ${ARTIFACT_S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-spectra-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me-local-s3-secret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://rustfs:9000}
      AWS_ALLOW_HTTP: ${AWS_ALLOW_HTTP:-true}

  api:
    build:
      args:
        CARGO_FEATURES: spectra-api/s3
    image: spectralabs/engine:dev-s3
    environment:
      ARTIFACT_STORAGE: s3
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-spectra-artifacts}
      ARTIFACT_S3_PREFIX: ${ARTIFACT_S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-spectra-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me-local-s3-secret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://rustfs:9000}
      AWS_ALLOW_HTTP: ${AWS_ALLOW_HTTP:-true}

  rustfs:
    image: rustfs/rustfs:1.0.3
    profiles: ["s3"]
    command: ["/data"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-spectra-local}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me-local-s3-secret}
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:9001:9001" # web console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  rustfs-init:
    image: rustfs/rc:latest
    profiles: ["s3"]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-spectra-local}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me-local-s3-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /usr/bin/rc alias set local http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}";
        /usr/bin/rc ls local/${ARTIFACT_S3_BUCKET:-spectra-artifacts} >/dev/null 2>&1 ||
        /usr/bin/rc mb local/${ARTIFACT_S3_BUCKET:-spectra-artifacts}
    restart: "no"

volumes:
  s3-data:
