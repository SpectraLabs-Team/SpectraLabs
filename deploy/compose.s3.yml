# S3-compatible artifact storage for the worker (M20 step 13).
#
# Local MinIO (bucket created for you):
#   docker compose -f docker-compose.yml -f deploy/compose.s3.yml --profile minio up -d --build
#
# AWS S3, Cloudflare R2 or another provider: create the bucket, then set in .env
#   ARTIFACT_S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION and
#   AWS_ENDPOINT (e.g. https://s3.eu-west-1.amazonaws.com), AWS_ALLOW_HTTP=false
# and run without the minio profile:
#   docker compose -f docker-compose.yml -f deploy/compose.s3.yml up -d --build
#
# Existing artifacts on the local volume are not copied. The key layout is the
# same (<prefix>/sha256/ab/cd/<hash>), so copy them once before switching, e.g.
#   aws s3 sync <artifacts volume>/sha256 s3://$ARTIFACT_S3_BUCKET/$ARTIFACT_S3_PREFIX/sha256
services:
  worker:
    build:
      args:
        CARGO_FEATURES: spectra-api/s3
    image: spectralabs/engine:dev-s3
    environment:
      ARTIFACT_STORAGE: s3
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-spectra-artifacts}
      ARTIFACT_S3_PREFIX: ${ARTIFACT_S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-spectra-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me-minio-secret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://minio:9000}
      AWS_ALLOW_HTTP: ${AWS_ALLOW_HTTP:-true}

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-spectra-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-change-me-minio-secret}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001" # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${AWS_ACCESS_KEY_ID:-spectra-minio}:${AWS_SECRET_ACCESS_KEY:-change-me-minio-secret}@minio:9000
    entrypoint: ["sh", "-c", "mc mb --ignore-existing local/${ARTIFACT_S3_BUCKET:-spectra-artifacts}"]
    restart: "no"

volumes:
  minio-data:
