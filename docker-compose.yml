# Local stack: Postgres, migrations + seed, the engine API and the dashboard.
#
#   cp .env.example .env                                   # fill in ENGINE_SECRET (and ADMIN_EMAIL)
#   cp web/frontend/.env.example web/frontend/.env.local   # AUTH_SECRET, Gmail settings
#   docker compose up --build                              # http://localhost:3000
#
  # Only the dashboard (and Postgres, for psql) are published, both on 127.0.0.1. The engine is
# reachable only inside this network, and only through the signed Next.js proxy.

name: spectralabs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spectra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spectra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply migrations, and seed the dev workspace when ADMIN_EMAIL is set.
  migrate:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    image: spectralabs/engine:dev
    command:
      - sh
      - -c
      - 'if [ -n "$$ADMIN_EMAIL" ]; then exec spectra-db seed; else exec spectra-db migrate; fi'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spectra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spectra}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    image: spectralabs/engine:dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spectra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spectra}
      ENGINE_SECRET: ${ENGINE_SECRET:?set ENGINE_SECRET in .env (openssl rand -base64 48)}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SPECTRA_API_ADDR: 0.0.0.0:8000
      SPECTRA_CORS_ORIGINS: http://localhost:3000
      SPECTRA_MIGRATE_ON_START: "false"
      ARTIFACT_STORAGE: local # read for backtest chart series; s3: see deploy/compose.s3.yml
      ARTIFACT_DIR: /var/lib/spectra/artifacts
    volumes:
      - artifacts:/var/lib/spectra/artifacts:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s # in-flight engine requests finish before SIGKILL

  worker:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    image: spectralabs/engine:dev
    command: ["spectra-worker"]
    # Scale out with: docker compose up -d --scale worker=3 (each claims jobs with SKIP LOCKED).
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spectra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spectra}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ARTIFACT_STORAGE: local # s3: see deploy/compose.s3.yml
      ARTIFACT_DIR: /var/lib/spectra/artifacts
      SPECTRA_DATA_DIR: /var/lib/spectra/datasets
      SPECTRA_WORKER_CONCURRENCY: ${SPECTRA_WORKER_CONCURRENCY:-2}
      SPECTRA_WORKSPACE_MAX_RUNNING: ${SPECTRA_WORKSPACE_MAX_RUNNING:-2}
      SPECTRA_WORKER_METRICS_ADDR: 0.0.0.0:9100 # /health and Prometheus /metrics, private network only
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - artifacts:/var/lib/spectra/artifacts
      - datasets:/var/lib/spectra/datasets
    expose:
      - "9100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: spectralabs/frontend:dev
    env_file:
      - path: web/frontend/.env.local
        required: false
    environment:
      ENGINE_URL: http://api:8000
      ENGINE_SECRET: ${ENGINE_SECRET}
    volumes:
      - web-data:/app/.data # keeps legacy users.json available for the one-off Postgres import
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Public edge (M20 step 12): TLS and security headers in front of the dashboard.
  #   docker compose --profile proxy up -d       (SITE_ADDRESS=your.domain for automatic HTTPS)
  caddy:
    image: caddy:2
    profiles: ["proxy"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  # Metrics (M20 step 11): scrapes the API and every worker replica.
  #   docker compose --profile monitoring up -d   then open http://127.0.0.1:9090
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  artifacts:
  datasets:
  web-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
