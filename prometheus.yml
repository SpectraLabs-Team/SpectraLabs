# Prometheus for Spectra (M20 step 11). Used by the `monitoring` compose profile:
#   docker compose --profile monitoring up -d
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # spectra-api: request latency by route pattern and status.
  - job_name: spectra-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # spectra-worker: job claims, completions and durations. Docker's DNS returns
  # one address per replica, so `--scale worker=N` is picked up automatically.
  - job_name: spectra-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 30s
